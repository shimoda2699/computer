/* ===== ユーティリティ ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(s){
  return String(s).normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))
    .replace(/[\s・\-_/／（）()!！'’。、,.ー]/g,'')
    .replace(/(です|だよ|だ|かな)$/,'');
}
D.forEach((x,i) => { x.id = i; x.keys = [x.n, ...(x.a||'').split(' ')].filter(Boolean).map(norm); });
function badge(k, cls='badge'){ return `<span class="${cls}" style="background:${K[k].c}">${esc(K[k].l)}</span>`; }
function val(x, key){
  if (x[key]) return x[key];
  if (key==='app') return x.k==='carrier' ? '—' : DEV_APP;
  if (key==='carrier') return DEV_CA;
  return '—';
}

/* ===== タブ ===== */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(t){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id==='p-'+t));
  if (t==='quiz' && !quiz) newQuiz();
}

/* ===== 調べる ===== */
const sorted = [...D].sort((a,b) => a.n.localeCompare(b.n,'ja'));
let selId = null;
function renderChips(){
  const q = norm($('#search').value);
  const list = q ? sorted.filter(x => x.keys.some(k => k.includes(q) || (q.length>=2 && q.includes(k)))) : sorted;
  $('#chips').innerHTML = list.length
    ? list.map(x => `<button class="chip${x.id===selId?' sel':''}" data-id="${x.id}">${esc(x.n)}</button>`).join('')
    : `<span style="color:var(--sub);font-size:.9rem">一覧にありません。メーカー名・製品名・OS名・通信会社名のどれにあたるか、下の「一覧表」で近いものを探してみよう。</span>`;
  $('#chips').querySelectorAll('.chip').forEach(c => c.onclick = () => show(+c.dataset.id));
  if (q && list.length===1) show(list[0].id, false);
}
$('#search').addEventListener('input', renderChips);

function show(id, scroll=true){
  selId = id; const x = D[id]; const k = K[x.k];
  $('#chips').querySelectorAll('.chip').forEach(c => c.classList.toggle('sel', +c.dataset.id===id));
  const rows = LAYERS.map(L => {
    if (L.g) return `<div class="grp">${esc(L.g)}</div>`;
    const hit = L.k===k.layer;
    return `<div class="layer${hit?' hit':''}">
      <div class="ln" ${hit?`style="background:${k.c}"`:''}>${hit?'▶ ':''}${esc(L.l)}</div>
      <div class="lv" ${hit?`style="background:${k.c}22"`:''}>${hit?`「${esc(x.n)}」`+(val(x,L.k)!==x.n?`<br><span style="font-weight:400;font-size:.85rem">${esc(val(x,L.k))}</span>`:''):esc(val(x,L.k))}</div>
    </div>`;
  }).join('');
  $('#result').innerHTML = `
  <div class="card">
    <p class="verdict">「${esc(x.n)}」は ${badge(x.k)} を答えています</p>
    <p class="desc">${esc(k.d)}</p>
    <div class="grid2">
      <div>
        <div class="stack">${rows}</div>
        <p style="font-size:.78rem;color:var(--sub);margin:6px 0 0">色のついた段が、この答えが指している層です。ほかの段は「この答えから考えられるもの」です。</p>
      </div>
      <div>
        <div class="box miss"><h4>この答えだけでは分からないこと</h4>${esc(k.m)}</div>
        <div class="box better"><h4>もっとはっきり答えるなら（例）</h4>「${esc(x.ex)}」</div>
        ${x.note?`<div class="box notebox"><h4>ポイント</h4>${esc(x.note)}</div>`:''}
      </div>
    </div>
  </div>`;
  if (scroll) $('#result').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ===== クイズ ===== */
const QN = 10;
let quiz = null;
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function newQuiz(){
  quiz = {qs: shuffle(D).slice(0,QN), i:0, score:0};
  drawQ();
}
function drawQ(){
  const box = $('#quizbox');
  if (quiz.i >= quiz.qs.length){
    box.innerHTML = `<div class="center">
      <p class="q">結果</p>
      <div class="score">${quiz.score} / ${quiz.qs.length}</div>
      <p class="desc">「メーカー」「製品ブランド」「OS」「回線」…どの層の名前なのかを意識して答えよう。</p>
      <button class="btn" id="again">もう一度</button></div>`;
    $('#again').onclick = newQuiz; return;
  }
  const x = quiz.qs[quiz.i];
  const others = shuffle(Object.keys(K).filter(k => k!==x.k)).slice(0,3);
  const opts = shuffle([x.k, ...others]);
  box.innerHTML = `
    <div class="qhead"><span>第 ${quiz.i+1} 問 / ${quiz.qs.length}</span><span>正解 ${quiz.score}</span></div>
    <div class="bubble"><small>「あなたの端末は何ですか？」── 生徒の答え</small>「${esc(x.n)}です」</div>
    <p class="center" style="margin:0;color:var(--sub)">この答えは、何を答えている？</p>
    <div class="opts">${opts.map(k => `<button class="opt" data-k="${k}">${esc(K[k].l)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b, x));
}
function answer(btn, x){
  const ok = btn.dataset.k===x.k;
  if (ok) quiz.score++;
  $('#quizbox').querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.k===x.k) b.classList.add('ok');
    else if (b===btn) b.classList.add('ng');
  });
  $('#fb').innerHTML = `
    <div class="box ${ok?'better':'miss'}"><h4>${ok?'正解！':'ざんねん…'}「${esc(x.n)}」は ${badge(x.k,'tbadge')}</h4>
    ${esc(K[x.k].d)}${x.note?'<br>'+esc(x.note):''}</div>
    <div class="box notebox"><h4>はっきり答えるなら</h4>「${esc(x.ex)}」</div>
    <div class="center"><button class="btn sub" id="next">${quiz.i+1<quiz.qs.length?'次の問題へ':'結果を見る'}</button></div>`;
  $('#next').onclick = () => { quiz.i++; drawQ(); };
}

/* ===== 一覧表 ===== */
let tf = 'all';
function renderTable(){
  const kinds = ['all', ...Object.keys(K)];
  $('#tfilter').innerHTML = kinds.map(k =>
    `<button class="${k===tf?'on':''}" data-k="${k}">${k==='all'?'すべて':esc(K[k].l)}</button>`).join('');
  $('#tfilter').querySelectorAll('button').forEach(b => b.onclick = () => { tf=b.dataset.k; renderTable(); });
  const rows = D.filter(x => tf==='all' || x.k===tf);
  $('#tbl').innerHTML = `<thead><tr>
    <th>生徒の答え</th><th>何を答えているか</th><th>メーカー・開発元</th><th>製品・ブランド例</th><th>端末分類</th>
    <th>OS</th><th>OS基盤・カーネル</th><th>主なSoC / CPU</th><th>命令セット</th><th>特徴</th></tr></thead><tbody>` +
    rows.map(x => `<tr class="row" data-id="${x.id}">
      <td><b>${esc(x.n)}</b></td><td>${badge(x.k,'tbadge')}</td><td>${esc(x.maker)}</td><td>${esc(x.k==='carrier'?x.carrier:x.k==='browser'||x.k==='app'?x.app:x.brand)}</td>
      <td>${esc(x.type)}</td><td>${esc(x.os)}</td><td>${esc(x.kernel)}</td><td>${esc(x.soc)}</td><td>${esc(x.isa)}</td><td>${esc(x.note)}</td></tr>`).join('') + '</tbody>';
  $('#tbl').querySelectorAll('tr.row').forEach(r => r.onclick = () => {
    showTab('look'); $('#search').value=''; renderChips(); show(+r.dataset.id);
  });
}

renderChips();
renderTable();
</script>
</body>
</html>
